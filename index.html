* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --coin-gold: #FFD700;
  --coin-shadow: #B8860B;
  --success-green: #4ADE80;
  --warning-red: #F87171;
  --magic-purple: #A855F7;
  --sky-blue: #38BDF8;
}

body {
  font-family: 'Fredoka', sans-serif;
  overflow: hidden;
  background: #0a0a1a;
  color: white;
}

#canvas-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

#game-ui {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  pointer-events: none;
  display: flex;
  flex-direction: column;
}

.ui-element {
  pointer-events: auto;
}

/* Camera feed */
#camera-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 180px;
  height: 135px;
  border-radius: 20px;
  overflow: hidden;
  border: 5px solid var(--magic-purple);
  box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
  transition: all 0.3s ease;
  z-index: 20;
}

#camera-container.brushing {
  border-color: var(--success-green);
  box-shadow: 0 0 40px rgba(74, 222, 128, 0.7);
}

#camera-container.not-brushing {
  border-color: var(--warning-red);
  box-shadow: 0 0 40px rgba(248, 113, 113, 0.7);
  animation: shake 0.5s ease-in-out infinite;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

#video-feed {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

#brush-status {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 8px;
  text-align: center;
  font-weight: 700;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

#brush-status.brushing {
  background: var(--success-green);
  color: #065F46;
}

#brush-status.not-brushing {
  background: var(--warning-red);
  color: #7F1D1D;
}

/* Top HUD */
#top-hud {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 20px 30px;
}

#timer-display {
  background: linear-gradient(135deg, rgba(0,0,0,0.7) 0%, rgba(30,30,60,0.7) 100%);
  border-radius: 20px;
  padding: 15px 30px;
  border: 3px solid var(--sky-blue);
  box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
}

#timer-text {
  font-family: 'Bangers', cursive;
  font-size: 48px;
  letter-spacing: 3px;
  text-shadow: 0 0 10px var(--sky-blue);
}

#timer-text.urgent {
  color: var(--warning-red);
  text-shadow: 0 0 10px var(--warning-red);
  animation: pulse 0.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

#coin-display {
  background: linear-gradient(135deg, var(--coin-gold) 0%, var(--coin-shadow) 100%);
  border-radius: 50px;
  padding: 15px 30px;
  display: flex;
  align-items: center;
  gap: 15px;
  border: 4px solid #FFF;
  box-shadow: 0 5px 20px rgba(0,0,0,0.3), inset 0 -3px 10px rgba(0,0,0,0.2);
}

#coin-icon {
  font-size: 40px;
  animation: coinSpin 2s linear infinite;
}

@keyframes coinSpin {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(360deg); }
}

#coin-count {
  font-family: 'Bangers', cursive;
  font-size: 42px;
  color: #5C4300;
  text-shadow: 2px 2px 0 #FFF;
}

/* Progress bar */
#progress-container {
  padding: 0 30px;
  margin-top: 10px;
}

#progress-bar {
  height: 25px;
  background: rgba(0,0,0,0.5);
  border-radius: 15px;
  overflow: hidden;
  border: 3px solid rgba(255,255,255,0.3);
  position: relative;
}

#progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, 
    #FF6B6B 0%, 
    #FFE66D 25%, 
    #4ECDC4 50%, 
    #45B7D1 75%, 
    #96E6A1 100%
  );
  background-size: 200% 100%;
  animation: gradientMove 2s linear infinite;
  border-radius: 12px;
  transition: width 0.5s ease;
  position: relative;
}

@keyframes gradientMove {
  0% { background-position: 0% 0%; }
  100% { background-position: 200% 0%; }
}

#progress-fill::after {
  content: '';
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 30px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5));
  border-radius: 12px;
}

/* Quadrant indicator */
#quadrant-display {
  position: fixed;
  top: 50%;
  left: 30px;
  transform: translateY(-50%);
  background: linear-gradient(135deg, rgba(168,85,247,0.9) 0%, rgba(79,70,229,0.9) 100%);
  border-radius: 20px;
  padding: 20px 25px;
  border: 3px solid rgba(255,255,255,0.5);
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  text-align: center;
}

#quadrant-label {
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 2px;
  opacity: 0.8;
  margin-bottom: 10px;
}

#quadrant-text {
  font-family: 'Bangers', cursive;
  font-size: 28px;
  letter-spacing: 2px;
}

#quadrant-icon {
  font-size: 50px;
  margin-top: 10px;
}

/* Encouragement popup */
#encouragement {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-family: 'Bangers', cursive;
  font-size: 60px;
  color: var(--coin-gold);
  text-shadow: 
    3px 3px 0 #000,
    -3px -3px 0 #000,
    3px -3px 0 #000,
    -3px 3px 0 #000,
    0 0 30px var(--coin-gold);
  white-space: nowrap;
  transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  z-index: 100;
}

#encouragement.show {
  transform: translate(-50%, -50%) scale(1);
}

/* Start screen */
#start-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

#start-screen.hidden {
  opacity: 0;
  visibility: hidden;
}

#start-title {
  font-family: 'Bangers', cursive;
  font-size: 80px;
  letter-spacing: 5px;
  background: linear-gradient(135deg, var(--coin-gold) 0%, #FFF 50%, var(--coin-gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
  margin-bottom: 20px;
}

#start-tooth {
  font-size: 120px;
  animation: bounce 1s ease-in-out infinite;
  margin-bottom: 30px;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

#start-subtitle {
  font-size: 28px;
  color: var(--sky-blue);
  margin-bottom: 50px;
}

#start-button {
  font-family: 'Bangers', cursive;
  font-size: 36px;
  letter-spacing: 3px;
  padding: 20px 60px;
  background: linear-gradient(135deg, var(--success-green) 0%, #22C55E 100%);
  border: none;
  border-radius: 50px;
  color: #065F46;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(74, 222, 128, 0.4), 0 5px 0 #16A34A;
  transition: all 0.2s ease;
  pointer-events: auto;
}

#start-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 40px rgba(74, 222, 128, 0.5), 0 8px 0 #16A34A;
}

#start-button:active {
  transform: translateY(2px);
  box-shadow: 0 5px 20px rgba(74, 222, 128, 0.4), 0 2px 0 #16A34A;
}

#camera-prompt {
  margin-top: 30px;
  font-size: 18px;
  opacity: 0.7;
}

/* Countdown overlay */
#countdown-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 500;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

#countdown-overlay.show {
  opacity: 1;
  visibility: visible;
}

#countdown-number {
  font-family: 'Bangers', cursive;
  font-size: 200px;
  color: var(--coin-gold);
  text-shadow: 0 0 50px var(--coin-gold);
  animation: countPulse 1s ease-in-out infinite;
}

@keyframes countPulse {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.2); opacity: 0.8; }
  100% { transform: scale(1); opacity: 1; }
}

/* Complete screen */
#complete-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

#complete-screen.show {
  opacity: 1;
  visibility: visible;
}

#complete-title {
  font-family: 'Bangers', cursive;
  font-size: 70px;
  letter-spacing: 5px;
  color: var(--coin-gold);
  text-shadow: 0 0 30px var(--coin-gold);
  margin-bottom: 20px;
}

#trophy-icon {
  font-size: 150px;
  animation: trophyBounce 0.5s ease-in-out infinite;
}

@keyframes trophyBounce {
  0%, 100% { transform: rotate(-5deg); }
  50% { transform: rotate(5deg); }
}

#final-coins {
  font-family: 'Bangers', cursive;
  font-size: 80px;
  color: var(--coin-gold);
  display: flex;
  align-items: center;
  gap: 20px;
  margin: 30px 0;
}

#star-rating {
  font-size: 60px;
  margin-bottom: 40px;
}

#play-again-button {
  font-family: 'Bangers', cursive;
  font-size: 32px;
  letter-spacing: 3px;
  padding: 18px 50px;
  background: linear-gradient(135deg, var(--magic-purple) 0%, #7C3AED 100%);
  border: none;
  border-radius: 50px;
  color: white;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4), 0 5px 0 #6D28D9;
  transition: all 0.2s ease;
  pointer-events: auto;
}

#play-again-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 40px rgba(168, 85, 247, 0.5), 0 8px 0 #6D28D9;
}

/* Floating coins animation */
.floating-coin {
  position: fixed;
  font-size: 50px;
  pointer-events: none;
  z-index: 200;
  animation: floatUp 1.5s ease-out forwards;
}

@keyframes floatUp {
  0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
  100% { transform: translateY(-300px) scale(1.5) rotate(360deg); opacity: 0; }
}

/* Hidden canvas for motion detection */
#motion-canvas {
  display: none;
}

/* Audio indicator */
#audio-indicator {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.3s ease;
}

#audio-indicator.active {
  background: var(--success-green);
  box-shadow: 0 0 10px var(--success-green);
}

#audio-indicator.inactive {
  background: rgba(100,100,100,0.7);
}

/* Sound level meter */
#sound-meter {
  position: fixed;
  bottom: 20px;
  right: 210px;
  width: 20px;
  height: 135px;
  background: rgba(0,0,0,0.5);
  border-radius: 10px;
  border: 3px solid rgba(255,255,255,0.3);
  overflow: hidden;
  z-index: 20;
}

#sound-meter-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 0%;
  background: linear-gradient(to top, var(--success-green), #22C55E, #FFD700, #F97316, #EF4444);
  transition: height 0.1s ease;
  border-radius: 0 0 7px 7px;
}

#sound-meter-threshold {
  position: absolute;
  left: 0;
  right: 0;
  height: 2px;
  background: white;
  z-index: 1;
}

#sound-meter-label {
  position: absolute;
  bottom: -25px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  white-space: nowrap;
  opacity: 0.8;
}

/* Power-up indicator */
#powerup-indicator {
  position: fixed;
  bottom: 170px;
  right: 20px;
  font-size: 40px;
  animation: powerupPulse 0.5s ease-in-out infinite;
  display: none;
  z-index: 25;
}

#powerup-indicator.show {
  display: block;
}

@keyframes powerupPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

/* Theme transition */
body, #canvas-container {
  transition: background-color 0.5s ease;
}

    function initThreeJS() {
      scene = new THREE.Scene();
      
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;
      
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      pointLight1.position.set(5, 5, 5);

      pointLight2.position.set(-5, -5, 5);

      // Create main tooth

      // Create background stars

    function createTooth() {
      const toothGroup = new THREE.Group();
      
      // Main tooth body - use cylinder + sphere for tooth shape
      const bodyGeometry = new THREE.CylinderGeometry(0.8, 1, 1.5, 32);
      const bodyMaterial = new THREE.MeshPhongMaterial({ 
        color: 0xffffff,
        shininess: 100,
        emissive: 0x222244,
        emissiveIntensity: 0.1
      });
      const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
      body.position.y = 0.3;
      toothGroup.add(body);
      
      // Top of tooth (crown)
      const crownGeometry = new THREE.SphereGeometry(0.85, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      const crown = new THREE.Mesh(crownGeometry, bodyMaterial);
      crown.position.y = 1.05;
      toothGroup.add(crown);
      
      // Roots
      const rootGeometry = new THREE.ConeGeometry(0.3, 0.8, 16);
      const root1 = new THREE.Mesh(rootGeometry, bodyMaterial);
      root1.position.set(-0.35, -0.8, 0);
      root1.rotation.z = 0.2;
      toothGroup.add(root1);
      
      const root2 = new THREE.Mesh(rootGeometry, bodyMaterial);
      root2.position.set(0.35, -0.8, 0);
      root2.rotation.z = -0.2;
      toothGroup.add(root2);
      
      // Happy face - eyes
      const eyeGeometry = new THREE.SphereGeometry(0.12, 16, 16);
      const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x333333 });
      
      const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
      leftEye.position.set(-0.3, 0.6, 0.75);
      toothGroup.add(leftEye);
      
      const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
      rightEye.position.set(0.3, 0.6, 0.75);
      toothGroup.add(rightEye);
      
      // Smile - use a torus segment
      const smileGeometry = new THREE.TorusGeometry(0.25, 0.05, 8, 16, Math.PI);
      const smileMaterial = new THREE.MeshBasicMaterial({ color: 0xff6b9d });
      const smile = new THREE.Mesh(smileGeometry, smileMaterial);
      smile.position.set(0, 0.25, 0.78);
      smile.rotation.x = Math.PI;
      smile.rotation.z = Math.PI;
      toothGroup.add(smile);
      
      // Sparkle effect
      const sparkleGeometry = new THREE.OctahedronGeometry(0.15);
      const sparkleMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
      const sparkle = new THREE.Mesh(sparkleGeometry, sparkleMaterial);
      sparkle.position.set(0.6, 1.2, 0.5);
      sparkle.userData.isSparkle = true;
      toothGroup.add(sparkle);
      
      tooth = toothGroup;
      tooth.position.y = 0.5;
      scene.add(tooth);
    }
    
    function createStars() {
      const starGeometry = new THREE.BufferGeometry();
      const starCount = 500;
      const positions = new Float32Array(starCount * 3);
      
      for (let i = 0; i < starCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 50;
        positions[i + 1] = (Math.random() - 0.5) * 50;
        positions[i + 2] = (Math.random() - 0.5) * 50 - 10;
      }
      
      starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      
      const starMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.1,
        transparent: true,
        opacity: 0.8
      });
      
      const stars = new THREE.Points(starGeometry, starMaterial);
      scene.add(stars);
    }
    
    function createBubbles() {
      const bubbleGeometry = new THREE.SphereGeometry(0.1, 16, 16);
      const bubbleMaterial = new THREE.MeshPhongMaterial({
        color: 0x88ccff,
        transparent: true,
        opacity: 0.6,
        shininess: 100
      });
      
      for (let i = 0; i < 30; i++) {
        const bubble = new THREE.Mesh(bubbleGeometry, bubbleMaterial.clone());
        bubble.position.set(
          (Math.random() - 0.5) * 10,
          (Math.random() - 0.5) * 10,
          (Math.random() - 0.5) * 5 - 2
        );
        bubble.scale.setScalar(Math.random() * 0.5 + 0.5);
        bubble.userData.speed = Math.random() * 0.02 + 0.01;
        bubble.userData.originalY = bubble.position.y;
        particles.push(bubble);
        scene.add(bubble);
      }
    }
    
    function create3DCoin() {
      const coinGroup = new THREE.Group();
      
      const coinGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.08, 32);
      const coinMaterial = new THREE.MeshPhongMaterial({
        color: 0xffd700,
        shininess: 100,
        emissive: 0x996600,
        emissiveIntensity: 0.3
      });
      
      const coin = new THREE.Mesh(coinGeometry, coinMaterial);
      coin.rotation.x = Math.PI / 2;
      coinGroup.add(coin);
      
      // Coin edge detail
      const edgeGeometry = new THREE.TorusGeometry(0.3, 0.04, 8, 32);
      const edgeMaterial = new THREE.MeshPhongMaterial({ color: 0xccaa00 });
      const edge = new THREE.Mesh(edgeGeometry, edgeMaterial);
      coinGroup.add(edge);
      
      coinGroup.position.set(
        (Math.random() - 0.5) * 4,
        -3,
        (Math.random() - 0.5) * 2
      );
      
      coinGroup.userData.velocity = 0.08 + Math.random() * 0.04;
      coinGroup.userData.rotationSpeed = 0.1 + Math.random() * 0.1;
      
      coins3D.push(coinGroup);
      scene.add(coinGroup);
    }
    
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    function animate() {
      animationId = requestAnimationFrame(animate);
      
      const time = Date.now() * 0.001;
      
      // Animate tooth
      if (tooth) {
        tooth.rotation.y = Math.sin(time * 0.5) * 0.3;
        tooth.position.y = 0.5 + Math.sin(time * 2) * 0.1;
        
        // Make tooth happier when brushing
        if (isBrushing && gameState === 'playing') {
          tooth.scale.setScalar(1 + Math.sin(time * 10) * 0.05);
        } else {
          tooth.scale.setScalar(1);
        }
        
        // Animate sparkle
        tooth.children.forEach(child => {
          if (child.userData.isSparkle) {
            child.rotation.y += 0.1;
            child.rotation.x += 0.05;
            child.scale.setScalar(0.8 + Math.sin(time * 5) * 0.3);
          }
        });
      }
      
      // Animate bubbles
      particles.forEach(bubble => {
        bubble.position.y += bubble.userData.speed;
        bubble.position.x += Math.sin(time + bubble.userData.originalY) * 0.01;
        
        if (bubble.position.y > 6) {
          bubble.position.y = -6;
        }
      });
      
      // Animate 3D coins
      coins3D.forEach((coin, index) => {
        coin.position.y += coin.userData.velocity;
        coin.rotation.y += coin.userData.rotationSpeed;
        coin.rotation.x += coin.userData.rotationSpeed * 0.5;
        
        if (coin.position.y > 5) {
          scene.remove(coin);
          coins3D.splice(index, 1);
        }
      });
      
      // Camera subtle movement
      camera.position.x = Math.sin(time * 0.3) * 0.3;
      camera.position.y = Math.cos(time * 0.2) * 0.2;
      camera.lookAt(0, 0.5, 0);
      
      renderer.render(scene, camera);
    }

    // ============ AUDIO SYSTEM (Sound Effects) ============
    let soundContext = null;
    let soundGain = null;

    function initSoundSystem() {
      if (soundContext) return;
      soundContext = new (window.AudioContext || window.webkitAudioContext)();
      soundGain = soundContext.createGain();
      soundGain.gain.value = 0.3;
      soundGain.connect(soundContext.destination);
    }

    function playTone(frequency, duration, type = 'sine', volume = 0.3) {
      if (!soundContext) return;
      const osc = soundContext.createOscillator();
      const gain = soundContext.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, soundContext.currentTime);
      gain.gain.setValueAtTime(volume, soundContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, soundContext.currentTime + duration);
      osc.connect(gain);
      gain.connect(soundContext.destination);
      osc.start();
      osc.stop(soundContext.currentTime + duration);
    }

    function playCoinSound() {
      if (!soundContext) return;
      // Cheerful ascending arpeggio
      const notes = [523, 659, 784, 1047]; // C5, E5, G5, C6
      notes.forEach((freq, i) => {
        setTimeout(() => playTone(freq, 0.15, 'sine', 0.2), i * 50);
      });
    }

    function playPowerupSound() {
      if (!soundContext) return;
      // Magical ascending scale with shimmer
      const notes = [392, 494, 587, 698, 784, 880, 988, 1047];
      notes.forEach((freq, i) => {
        setTimeout(() => playTone(freq, 0.2, 'triangle', 0.15), i * 40);
      });
    }

    function playCountdownBeep(isGo = false) {
      if (!soundContext) return;
      if (isGo) {
        // "GO!" fanfare
        playTone(523, 0.1, 'square', 0.2);
        setTimeout(() => playTone(659, 0.1, 'square', 0.2), 100);
        setTimeout(() => playTone(784, 0.3, 'square', 0.25), 200);
      } else {
        // Regular countdown beep
        playTone(440, 0.15, 'sine', 0.25);
      }
    }

    function playVictoryFanfare() {
      if (!soundContext) return;
      // Triumphant fanfare
      const melody = [
        { freq: 523, time: 0, dur: 0.15 },
        { freq: 523, time: 150, dur: 0.15 },
        { freq: 523, time: 300, dur: 0.15 },
        { freq: 659, time: 450, dur: 0.4 },
        { freq: 587, time: 650, dur: 0.15 },
        { freq: 659, time: 800, dur: 0.15 },
        { freq: 784, time: 950, dur: 0.5 },
      ];
      melody.forEach(note => {
        setTimeout(() => playTone(note.freq, note.dur, 'triangle', 0.2), note.time);
      });
    }

    function playEncouragementSound() {
      if (!soundContext) return;
      // Quick happy chime
      playTone(880, 0.1, 'sine', 0.15);
      setTimeout(() => playTone(1109, 0.15, 'sine', 0.15), 80);
    }

    function playWarningSound() {
      if (!soundContext) return;
      // Gentle reminder sound
      playTone(330, 0.2, 'triangle', 0.1);
    }

    function playQuadrantChangeSound() {
      if (!soundContext) return;
      // Soft notification
      playTone(587, 0.1, 'sine', 0.12);
      setTimeout(() => playTone(698, 0.15, 'sine', 0.12), 100);
    }

    // ============ MICROPHONE DETECTION ============
    async function startMicrophone() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        microphoneStream = stream;

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);

        audioAnalyser = audioContext.createAnalyser();
        audioAnalyser.fftSize = 256;
        audioAnalyser.smoothingTimeConstant = 0.5;

        source.connect(audioAnalyser);
        audioDataArray = new Uint8Array(audioAnalyser.frequencyBinCount);

        return true;
      } catch (err) {
        console.warn('Microphone not available:', err);
        // Game still works without microphone, just uses camera
        return false;
      }
    }

    function stopMicrophone() {
      if (microphoneStream) {
        microphoneStream.getTracks().forEach(track => track.stop());
        microphoneStream = null;
      }
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }
    }

    function detectBrushingSound() {
      if (!audioAnalyser || !audioDataArray) return true; // If no mic, don't block

      audioAnalyser.getByteFrequencyData(audioDataArray);

      // Calculate average volume across all frequencies
      let totalEnergy = 0;
      for (let i = 0; i < audioDataArray.length; i++) {
        totalEnergy += audioDataArray[i];
      }
      const avgEnergy = totalEnergy / audioDataArray.length / 255;

      // Update sound meter visual (cap at 100%)
      const meterLevel = Math.min(100, avgEnergy * 200);
      elements.soundMeterFill.style.height = meterLevel + '%';

      // Position threshold line (threshold is 0-1, convert to percentage)
      const thresholdPos = CONFIG.AUDIO_THRESHOLD * 200;
      elements.soundMeterThreshold.style.bottom = thresholdPos + '%';

      // Simple volume-based detection - brushing creates sustained sound
      const isBrushing = avgEnergy > CONFIG.AUDIO_THRESHOLD;

      if (isBrushing) {
        audioStreak++;
      } else {
        // Decay slowly so brief pauses don't reset
        audioStreak = Math.max(0, audioStreak - 0.5);
      }

      // Need just a couple frames of sustained audio
      return audioStreak > 2;
    }

    // ============ CAMERA & MOTION DETECTION ============
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 320, height: 240 }
        });
        elements.videoFeed.srcObject = stream;
        return true;
      } catch (err) {
        console.error('Camera error:', err);
        alert('Could not access camera. Please allow camera access and try again!');
        return false;
      }
    }
    
    function stopCamera() {
      const stream = elements.videoFeed.srcObject;
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        elements.videoFeed.srcObject = null;
      }
    }
    
    function detectMotion() {
      const video = elements.videoFeed;
      const canvas = elements.motionCanvas;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      
      canvas.width = 80;
      canvas.height = 60;
      
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
      
      if (!prevFrame) {
        prevFrame = currentFrame;
        return false;
      }
      
      let motionPixels = 0;
      const totalPixels = currentFrame.data.length / 4;
      
      for (let i = 0; i < currentFrame.data.length; i += 16) { // Sample every 4th pixel for performance
        const rDiff = Math.abs(currentFrame.data[i] - prevFrame.data[i]);
        const gDiff = Math.abs(currentFrame.data[i + 1] - prevFrame.data[i + 1]);
        const bDiff = Math.abs(currentFrame.data[i + 2] - prevFrame.data[i + 2]);
        
        if ((rDiff + gDiff + bDiff) / 3 > CONFIG.MOTION_THRESHOLD) {
          motionPixels++;
        }
      }
      
      prevFrame = currentFrame;
      const motionRatio = (motionPixels * 4) / totalPixels; // Adjust for sampling
      return motionRatio > CONFIG.MOTION_PIXEL_RATIO;
    }
    
    // ============ GAME LOGIC ============
    function updateBrushingStatus(brushing) {
      isBrushing = brushing;
      
      if (brushing) {
        elements.cameraContainer.classList.add('brushing');
        elements.cameraContainer.classList.remove('not-brushing');
        elements.brushStatus.classList.add('brushing');
        elements.brushStatus.classList.remove('not-brushing');
        elements.brushStatus.textContent = '✓ BRUSHING!';
        brushingStreak++;
      } else {
        elements.cameraContainer.classList.remove('brushing');
        elements.cameraContainer.classList.add('not-brushing');
        elements.brushStatus.classList.remove('brushing');
        elements.brushStatus.classList.add('not-brushing');
        elements.brushStatus.textContent = 'KEEP BRUSHING!';
        brushingStreak = 0;
      }
    }
    
    function awardCoin() {
      const coinsToAdd = coinMultiplier;
      coins += coinsToAdd;
      elements.coinCount.textContent = coins;

      // Play coin sound
      playCoinSound();

      // Create floating coins in DOM
      for (let c = 0; c < coinsToAdd; c++) {
        setTimeout(() => {
          const floatingCoin = document.createElement('div');
          floatingCoin.className = 'floating-coin';
          floatingCoin.textContent = activePowerup === 'rainbow' ? '💎' : '🪙';
          floatingCoin.style.left = (Math.random() * 60 + 20) + '%';
          floatingCoin.style.bottom = '20%';
          if (activePowerup === 'rainbow') {
            floatingCoin.style.filter = `hue-rotate(${Math.random() * 360}deg)`;
          }
          document.body.appendChild(floatingCoin);
          setTimeout(() => floatingCoin.remove(), 1500);
        }, c * 100);
      }

      // Create 3D coin(s)
      for (let c = 0; c < coinsToAdd; c++) {
        setTimeout(() => create3DCoin(), c * 100);
      }

      // Show encouragement occasionally
      if (Math.random() > 0.5) {
        showEncouragement();
      }

      // Random power-up chance
      if (Math.random() < CONFIG.POWERUP_CHANCE && !activePowerup) {
        triggerPowerup();
      }
    }

    function triggerPowerup() {
      const powerup = POWERUPS[Math.floor(Math.random() * POWERUPS.length)];
      activePowerup = powerup.type;
      powerupEndTime = Date.now() + powerup.duration;

      if (powerup.type === 'double') {
        coinMultiplier = 2;
      }

      // Show power-up notification
      elements.encouragement.textContent = powerup.icon + ' ' + powerup.text;
      elements.encouragement.classList.add('show');
      playPowerupSound();

      setTimeout(() => {
        elements.encouragement.classList.remove('show');
      }, 1500);

      // End power-up after duration
      setTimeout(() => {
        activePowerup = null;
        coinMultiplier = 1;
      }, powerup.duration);
    }
    
    function showEncouragement() {
      const msg = ENCOURAGEMENTS[Math.floor(Math.random() * ENCOURAGEMENTS.length)];
      elements.encouragement.textContent = msg;
      elements.encouragement.classList.add('show');
      playEncouragementSound();

      setTimeout(() => {
        elements.encouragement.classList.remove('show');
      }, 1500);
    }
    
    function updateTimer() {
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      elements.timerText.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
      
      if (timeLeft <= 10) {
        elements.timerText.classList.add('urgent');
      } else {
        elements.timerText.classList.remove('urgent');
      }
      
      // Update progress bar
      const progress = ((CONFIG.BRUSH_TIME - timeLeft) / CONFIG.BRUSH_TIME) * 100;
      elements.progressFill.style.width = progress + '%';
    }
    
    function updateQuadrant() {
      currentQuadrant = (currentQuadrant + 1) % QUADRANTS.length;
      elements.quadrantText.textContent = QUADRANTS[currentQuadrant].text;
      elements.quadrantIcon.textContent = QUADRANTS[currentQuadrant].icon;
      playQuadrantChangeSound();
    }
    
    function gameComplete() {
      gameState = 'complete';
      stopCamera();
      stopMicrophone();

      elements.finalCoinCount.textContent = coins;

      // Calculate stars (1-5 based on coins)
      const starCount = Math.min(5, Math.max(1, Math.ceil(coins / 8)));
      elements.starRating.textContent = '⭐'.repeat(starCount) + '☆'.repeat(5 - starCount);

      // Play victory fanfare
      playVictoryFanfare();

      elements.completeScreen.classList.add('show');
      gamesPlayed++;
    }
    
    function resetGame() {
      timeLeft = CONFIG.BRUSH_TIME;
      coins = 0;
      currentQuadrant = 0;
      brushingStreak = 0;
      lastCoinTime = 0;
      prevFrame = null;
      audioStreak = 0;
      activePowerup = null;
      coinMultiplier = 1;

      elements.coinCount.textContent = '0';
      elements.timerText.classList.remove('urgent');
      elements.quadrantText.textContent = QUADRANTS[0].text;
      elements.quadrantIcon.textContent = QUADRANTS[0].icon;
      updateTimer();

      // Clean up 3D coins
      coins3D.forEach(coin => scene.remove(coin));
      coins3D = [];

      // Pick a new random theme for variety
      applyRandomTheme();
    }

    function applyRandomTheme() {
      // Rotate through themes or pick random
      if (gamesPlayed > 0) {
        currentTheme = (currentTheme + 1) % THEMES.length;
      }
      const theme = THEMES[currentTheme];

      // Apply theme to scene
      renderer.setClearColor(theme.bg);

      // Update lights
      scene.children.forEach(child => {
        if (child.isPointLight) {
          if (child.position.x > 0) {
            child.color.setHex(theme.light1);
          } else {
            child.color.setHex(theme.light2);
          }
        }
      });

      // Update CSS accent color
      document.documentElement.style.setProperty('--magic-purple', theme.accent);
    }
    
    // ============ GAME LOOP ============
    let gameLoopId, timerLoopId, quadrantLoopId;
    
    function startGameLoop() {
      // Motion and audio detection loop (10fps)
      gameLoopId = setInterval(() => {
        if (gameState !== 'playing') return;

        const motionDetected = detectMotion();
        const audioDetected = detectBrushingSound();

        // Update audio indicator
        if (audioDetected) {
          elements.audioIndicator.classList.add('active');
          elements.audioIndicator.classList.remove('inactive');
        } else {
          elements.audioIndicator.classList.remove('active');
          elements.audioIndicator.classList.add('inactive');
        }

        // Update power-up indicator
        if (activePowerup) {
          const powerup = POWERUPS.find(p => p.type === activePowerup);
          if (powerup) {
            elements.powerupIndicator.textContent = powerup.icon;
            elements.powerupIndicator.classList.add('show');
          }
        } else {
          elements.powerupIndicator.classList.remove('show');
        }

        // Require BOTH motion AND audio for brushing to count
        // This prevents earning coins without actually brushing
        const isTrulyBrushing = motionDetected && audioDetected;
        updateBrushingStatus(isTrulyBrushing);

        // Award coins for sustained brushing (both motion AND sound)
        const now = Date.now();
        if (isTrulyBrushing && brushingStreak > 5 && now - lastCoinTime > CONFIG.COIN_INTERVAL) {
          awardCoin();
          lastCoinTime = now;
        }

        // Play gentle warning if not brushing for a while
        if (!isTrulyBrushing && brushingStreak === 0 && Math.random() < 0.02) {
          playWarningSound();
        }
      }, 100);
      
      // Timer loop (1fps)
      timerLoopId = setInterval(() => {
        if (gameState !== 'playing') return;
        
        timeLeft--;
        updateTimer();
        
        if (timeLeft <= 0) {
          gameComplete();
          stopGameLoop();
        }
      }, 1000);
      
      // Quadrant rotation
      quadrantLoopId = setInterval(() => {
        if (gameState !== 'playing') return;
        updateQuadrant();
      }, CONFIG.QUADRANT_INTERVAL);
    }
    
    function stopGameLoop() {
      clearInterval(gameLoopId);
      clearInterval(timerLoopId);
      clearInterval(quadrantLoopId);
    }
    
    // ============ EVENT HANDLERS ============
    async function handleStart() {
      // Initialize sound system (needs user interaction to start)
      initSoundSystem();

      const cameraStarted = await startCamera();
      if (!cameraStarted) return;

      // Start microphone for brushing sound detection
      await startMicrophone();

      elements.startScreen.classList.add('hidden');

      // Countdown
      gameState = 'countdown';
      elements.countdownOverlay.classList.add('show');

      let count = 3;
      elements.countdownNumber.textContent = count;
      playCountdownBeep(false);

      const countdownInterval = setInterval(() => {
        count--;
        if (count > 0) {
          elements.countdownNumber.textContent = count;
          playCountdownBeep(false);
        } else if (count === 0) {
          elements.countdownNumber.textContent = 'GO!';
          playCountdownBeep(true);
        } else {
          clearInterval(countdownInterval);
          elements.countdownOverlay.classList.remove('show');
          gameState = 'playing';
          startGameLoop();
        }
      }, 1000);
    }
    
    function handlePlayAgain() {
      elements.completeScreen.classList.remove('show');
      resetGame();
      handleStart();
    }
    
    // ============ INITIALIZATION ============
    function init() {
      initThreeJS();
      
      elements.startButton.addEventListener('click', handleStart);
      elements.playAgainButton.addEventListener('click', handlePlayAgain);
    }
    
    // Start the app
    init();
  </script>
